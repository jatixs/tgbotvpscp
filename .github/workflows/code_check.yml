name: Security & Code Quality Check

on:
  push:
    branches: [ "main", "develop", "release/*", "feature/*", "hotfix/*" ]
  pull_request:
    branches: [ "main", "develop", "release/*", "feature/*", "hotfix/*" ]
  workflow_dispatch:

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit safety
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🔍 Lint with Flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names (Critical)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check style (Earnings, max line length 120)
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: 🛡️ Security Audit with Bandit
      run: |
        # Checks for common security issues
        # -r: recursive, -ll: medium confidence/severity
        bandit -r . -ll

    - name: 📦 Check Dependencies Vulnerabilities
      continue-on-error: true
      run: |
        # Scans requirements.txt for known vulnerabilities
        safety check -r requirements.txt

    - name: 🐚 ShellCheck
      uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
      with:
        scandir: '.'
      continue-on-error: true
